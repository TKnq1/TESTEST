<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor aktiv</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Komplett schwarzer Bildschirm - Das Handy soll unsichtbar arbeiten */
        body {
            background: #000000;
            color: #111111; /* Fast unsichtbarer Text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .info {
            text-align: center;
            color: #222; /* Minimal sichtbar für dich beim Setup */
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="info">
        <p>Sensor-Tool aktiv.</p>
        <p>Steuerung erfolgt über den Monitor.</p>
    </div>

    <script>
        // Session ID aus der URL auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const supabaseUrl = 'https://xyz.supabase.co';
        const supabaseKey = 'public-anon-key';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        const channel = supabaseClient.channel(roomId);

        let streamActive = false;

        channel
            .on('broadcast', { event: 'trigger-calibration' }, () => {
                // PC hat signalisiert: Kalibriere jetzt!
                captureTableBaseline();
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    // Dem PC sagen, dass das Handy einsatzbereit ist
                    channel.send({ type: 'broadcast', event: 'phone-connected', payload: {} });
                    initSensorAccess();
                }
            });

        async function initSensorAccess() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS verlangt leider beim allerersten Mal ein kurzes Tippen auf den schwarzen Bildschirm
                document.body.addEventListener('click', async () => {
                    await DeviceOrientationEvent.requestPermission();
                    startGyroStreaming();
                }, { once: true });
            } else {
                // Android startet sofort
                startGyroStreaming();
            }
        }

        function startGyroStreaming() {
            window.addEventListener('deviceorientation', (event) => {
                // Sende die rohen Live-Daten permanent an den PC
                channel.send({
                    type: 'broadcast',
                    event: 'gyro-data',
                    payload: {
                        beta: event.beta || 0,
                        gamma: event.gamma || 0
                    }
                });
            });
        }

        function captureTableBaseline() {
            // Einmaliges Vibrationssignal ans Loch in der Hand senden: "PC hat kalibriert!"
            if (navigator.vibrate) navigator.vibrate(200);
        }
    </script>
</body>
</html>

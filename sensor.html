<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor aktiv</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            background: #ef4444; /* Rot signalisiert: Bitte tippen */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            text-align: center;
            transition: background 0.5s ease;
        }
        .wrapper { padding: 2rem; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="wrapper" id="status-wrapper">
        <h1>HIER TIPPEN</h1>
        <p>Um die Sensor-Verbindung zum PC freizuschalten.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "phone_" + roomId);
        let mqttConnected = false;

        client.onConnectionLost = () => { mqttConnected = false; };
        client.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            if (data.type === 'trigger-vibrate' && navigator.vibrate) {
                navigator.vibrate(200); // Handy vibriert, wenn am PC kalibriert wurde
            }
        };

        client.connect({
            onSuccess: () => {
                client.subscribe("wasserwaage/" + roomId);
                mqttConnected = true;
            },
            useSSL: true
        });

        // Klick schaltet Gyro frei
        document.body.addEventListener('click', async () => {
            document.getElementById('status-wrapper').innerHTML = "<h1>Sensor aktiv!</h1><p>Schau jetzt auf deinen PC-Bildschirm.</p>";
            document.body.style.background = "#000000"; // Wird schwarz, kann weggelegt werden

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') startStreaming();
                } catch(e) { alert("Fehler: " + e); }
            } else {
                startStreaming();
            }
        });

        function startStreaming() {
            // Signalisiert dem PC SOFORT: Ich habe gescannt, du kannst umspringen!
            sendToPC({ type: 'phone-connected' });

            // Streamt die Daten live an den PC
            window.addEventListener('deviceorientation', (event) => {
                sendToPC({
                    type: 'gyro-data',
                    beta: event.beta || 0,
                    gamma: event.gamma || 0
                });
            });
        }

        function sendToPC(obj) {
            if (!mqttConnected) return;
            try {
                const message = new Paho.MQTT.Message(JSON.stringify(obj));
                message.destinationName = "wasserwaage/" + roomId;
                client.send(message);
            } catch(e) {}
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor aktiv</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            background: #ef4444; /* Startet Rot als Signal, dass man klicken muss */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            text-align: center;
            transition: background 0.5s ease;
            user-select: none;
        }
        .wrapper {
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="wrapper" id="status-wrapper">
        <h1>HIER TIPPEN!</h1>
        <p>Danach sofort flach mit dem Display nach unten auf den Tisch legen.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        // Verbindung zum MQTT Server aufbauen
        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "phone_" + roomId);
        let mqttConnected = false;

        client.onConnectionLost = () => { mqttConnected = false; };
        client.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            if (data.type === 'trigger-vibrate' && navigator.vibrate) {
                navigator.vibrate(200);
            }
        };

        client.connect({
            onSuccess: () => {
                client.subscribe("wasserwaage/" + roomId);
                mqttConnected = true;
            },
            useSSL: true
        });

        // Beim Klick auf den Bildschirm Sensorrechte einfordern und Stream starten
        document.body.addEventListener('click', async () => {
            document.getElementById('status-wrapper').innerHTML = "<h1>Aktiviert!</h1><p>Wird kalibriert...</p>";
            document.body.style.background = "#000000"; // Bildschirm wird schwarz für den Tisch-Modus

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        startStreaming();
                    } else {
                        alert("Sensor-Berechtigung wurde verweigert!");
                    }
                } catch(e) { alert("Fehler bei iOS-Rechten: " + e); }
            } else {
                // Android & andere
                startStreaming();
            }
        });

        function startStreaming() {
            // Dem PC sofort sagen, dass wir bereit sind
            sendToPC({ type: 'phone-connected' });

            // Permanent die Gyro-Daten an den PC senden
            window.addEventListener('deviceorientation', (event) => {
                sendToPC({
                    type: 'gyro-data',
                    beta: event.beta || 0,
                    gamma: event.gamma || 0
                });
            });
        }

        function sendToPC(obj) {
            if (!mqttConnected) return;
            try {
                const message = new Paho.MQTT.Message(JSON.stringify(obj));
                message.destinationName = "wasserwaage/" + roomId;
                client.send(message);
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>

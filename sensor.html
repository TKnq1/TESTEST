<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor aktiv</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            background: #000000;
            color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            text-align: center;
        }
        .info {
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="info">
        <p style="color: #444; font-size: 1.2rem;">Sensor-Tool im Hintergrund aktiv.</p>
        <p style="color: #222; font-size: 0.9rem;">(iOS: Falls keine Verbindung kommt, 1x tippen)</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "phone_" + roomId);
        let sensorsActive = false;

        client.onConnectionLost = (responseObject) => { if (responseObject.errorCode !== 0) console.log("Verbindung verloren"); };
        
        client.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            if (data.type === 'trigger-vibrate') {
                if (navigator.vibrate) navigator.vibrate(200);
            }
        };

        client.connect({
            onSuccess: () => {
                client.subscribe("wasserwaage/" + roomId);
                
                // Melde dem PC, dass wir da sind
                sendToPC({ type: 'phone-connected' });
                
                // Gyroskop aktivieren
                initSensors();
            },
            useSSL: true
        });

        function sendToPC(obj) {
            try {
                const message = new Paho.MQTT.Message(JSON.stringify(obj));
                message.destinationName = "wasserwaage/" + roomId;
                client.send(message);
            } catch(e) { console.log(e); }
        }

        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS verlangt eine Interaktion
                document.body.addEventListener('click', async () => {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') startStreaming();
                }, { once: true });
            } else {
                // Android startet direkt
                startStreaming();
            }
        }

        function startStreaming() {
            if (sensorsActive) return;
            sensorsActive = true;
            
            window.addEventListener('deviceorientation', (event) => {
                sendToPC({
                    type: 'gyro-data',
                    beta: event.beta || 0,
                    gamma: event.gamma || 0
                });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Landingpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="seiten-inhalt">

        <h1 class="haupt-titel">Adjust your 
            <p>monitors in 1 click</p></h1>

        <div class="qr-card">
            <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.google.com" alt="QR Code">
            
            <h2>Smart <span>Adjust</span></h2>
            <p>Scan this QR-code with your phone</p>
        </div>

    </div>

</body>
</html>

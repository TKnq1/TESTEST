<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Wasserwaage | Monitor-Ausrichtung</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <div class="content-left">
            <h1>Workspace Ausrichtung</h1>
            
            <div id="pc-step-1" class="step active">
                <p>1. Scanne den QR-Code mit deinem Smartphone.</p>
                <p style="margin-bottom: 1.5rem; color: var(--accent); font-weight: bold;">2. Tippe auf den roten Handybildschirm!</p>
                <button class="btn" id="pc-calibrate-btn" disabled style="opacity: 0.5; cursor: not-allowed;">Warte auf Smartphone-Verbindung...</button>
            </div>

            <div id="pc-step-2" class="step">
                <p style="margin-bottom: 1.5rem;">3. Nimm das Handy jetzt hoch und halte es <strong>flach an deinen Monitor</strong>.</p>
                
                <div id="live-box" class="live-display status-error">
                    <div id="status-msg" class="status-text">⚠️ Nicht parallel</div>
                    <div class="deviation-val"><span id="degree-val">0.0</span>°</div>
                </div>
            </div>
        </div>

        <div class="qr-card" id="qr-section">
            <div class="qr-code-placeholder">
                <img id="qr-img" src="" alt="Generiere QR Code...">
            </div>
            <h2>Verbinde dein Sensor-Tool</h2>
            <p id="connection-status" style="color: var(--error); font-weight: bold;">Status: Getrennt</p>
        </div>
    </div>

    <script>
        const sessionId = 'room_' + Math.random().toString(36).substr(2, 9);
        
        // Dynamischer QR-Code Link
        const sensorUrl = `https://tknq1.github.io/TESTEST/sensor.html?room=${sessionId}`;
        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(sensorUrl)}`;

        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "pc_" + sessionId);

        let tableBeta = 0;
        let tableGamma = 0;
        let calibrating = false;
        let currentLiveBeta = 0;
        let currentLiveGamma = 0;

        client.onConnectionLost = () => { console.log("Verbindung zum Server verloren"); };
        
        client.onMessageArrived = (message) => {
            const data = JSON.parse(message.payloadString);
            
            // Handy hat sich erfolgreich gemeldet
            if (data.type === 'phone-connected') {
                const btn = document.getElementById('pc-calibrate-btn');
                document.getElementById('connection-status').textContent = 'Status: Verbunden ✔';
                document.getElementById('connection-status').style.color = 'var(--success)';
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                btn.textContent = 'Tisch-Neigung jetzt speichern';
            }
            
            // Gyro-Daten vom Handy empfangen
            if (data.type === 'gyro-data') {
                currentLiveBeta = data.beta;
                currentLiveGamma = data.gamma;

                // Wenn der Button geklickt wurde, loggen wir genau diesen Moment als Tisch-Referenz
                if (calibrating) {
                    tableBeta = currentLiveBeta;
                    tableGamma = currentLiveGamma;
                    calibrating = false;
                    
                    // Sofort umschalten auf Monitor-Live-Ansicht
                    document.getElementById('pc-step-1').classList.remove('active');
                    document.getElementById('pc-step-2').classList.add('active');
                } else if (tableBeta !== 0) {
                    // Wenn kalibriert, berechne permanent die Differenz
                    handleLiveCalculation(currentLiveBeta, currentLiveGamma);
                }
            }
        };

        client.connect({
            onSuccess: () => {
                client.subscribe("wasserwaage/" + sessionId);
            },
            useSSL: true
        });

        // Klick auf den PC-Button speichert den aktuellen Wert
        document.getElementById('pc-calibrate-btn').addEventListener('click', () => {
            calibrating = true;
            
            // Vibrations-Befehl ans Handy schicken
            try {
                const message = new Paho.MQTT.Message(JSON.stringify({ type: 'trigger-vibrate' }));
                message.destinationName = "wasserwaage/" + sessionId;
                client.send(message);
            } catch(e) {}
        });

        function handleLiveCalculation(currentBeta, currentGamma) {
            // Berechnung basierend auf der Display-nach-unten Lage des Handys auf dem Tisch
            const diffBeta = currentBeta + tableBeta; 
            const diffGamma = currentGamma - tableGamma; 
            const totalDeviation = Math.sqrt(diffBeta * diffBeta + diffGamma * diffGamma);

            const liveBox = document.getElementById('live-box');
            const statusMsg = document.getElementById('status-msg');
            const degreeVal = document.getElementById('degree-val');

            degreeVal.textContent = totalDeviation.toFixed(1);

            if (totalDeviation < 1.5) {
                liveBox.className = "live-display status-success";
                statusMsg.textContent = "✓ Perfekt parallel!";
            } else {
                liveBox.className = "live-display status-error";
                statusMsg.textContent = "⚠️ Nicht parallel";
            }
        }
    </script>
</body>
</html>
